# GitLab equivalent of .github/workflows/test.yml. Both are kept because the template itself must
# not assume a host — the same reason project.conf carries HOST rather than hardcoding one.
test:
  image: debian:stable-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 shellcheck
    # test.sh snapshots the working tree into a scratch repo and clones it; git refuses to operate
    # on a checkout it considers owned by another user inside a container.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git config --global user.email ci@example.com
    - git config --global user.name CI
  script:
    - find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning
    - ./test.sh -v
    # The fixture suite self-skips, exit 0, when its two source repositories are absent, as here.
    - ./test_fixture.sh -v

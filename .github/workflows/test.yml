name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # test.sh snapshots the working tree into a scratch repo and clones it, and git refuses to
      # operate on a checkout it considers owned by another user inside a container.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The scratch repo is committed to, so an identity is required.
      - name: Set a git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # Informational for now: the scripts are readable-first and a few warnings are deliberate.
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S error || true

      - name: ./test.sh
        run: ./test.sh -v

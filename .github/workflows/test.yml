# Runs ./test.sh on every push and pull request, so a change to a hook, a skill or the install
# flow cannot land broken. The GitLab equivalent is /.gitlab-ci.yml; both exist because this
# template must not assume a git host.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # test.sh snapshots the working tree into a scratch repo and clones it, and git refuses to
      # operate on a checkout it considers owned by another user inside a container.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The scratch repo is committed to, so an identity is required.
      - name: Set a git identity
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI

      # Gates at warning level, not error (which finds nothing here) and not the default (111
      # style findings, mostly quoting preferences that would make this noise rather than a gate).
      # Warning is where SC2164 lives: a `cd` that fails and then runs commands in the wrong
      # directory, which is the silent-failure class this repository cares most about.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck -S warning

      - name: ./test.sh
        run: ./test.sh -v

      # The fixture suite needs a real code repo and a real working-docs repo; with neither present
      # it prints one line and exits 0, so running it here costs nothing and catches a broken script.
      - name: ./test_fixture.sh
        run: ./test_fixture.sh -v

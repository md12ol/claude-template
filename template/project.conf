# Project identity — written by /setup, read by every hook, check and skill.
#
# This file exists so that NOTHING else in .claude/ hardcodes your repo name, your git host, or
# how your team is shaped. Before it existed, the project this template came from had ~30 copies
# of its own clone URL scattered across hooks, checks and nine skill bodies, and its CLAUDE.md
# still told you to update "all three" of them.
#
# Format is POSIX `KEY=value`, deliberately: hooks `source` it directly, and skills read it with
# grep. JSON would need `jq`, which is not on a fresh cloud container or a new teammate's laptop.
#
# Edit by hand any time. /setup only writes it once.

# --- identity ----------------------------------------------------------------------------------

# The project this .claude/ belongs to. Used in backup paths and in what the hooks print.
PROJECT_NAME="<project>"

# This working-docs repo — the fork of claude-template that is cloned as .claude/. Named
# <project>-claude by convention, but nothing depends on the name matching.
DOCS_REPO_NAME="<project>-claude"

# The clone URL for DOCS_REPO_NAME, exactly as you would type it. This is what a machine that has
# not cloned .claude/ yet gets told to run, so paste the one your host actually gives you —
# SSH or HTTPS, github.com, gitlab.com, or your own server.
DOCS_REPO_URL=""

# The branch DOCS_REPO_NAME lives on. A working-docs repo has one branch by design; if yours is
# called something else, say so here rather than editing the hooks.
DOCS_BRANCH="main"

# --- host and tracker --------------------------------------------------------------------------

# Where the CODE repo is hosted: github | gitlab | other. /setup detects this from `git remote -v`.
# "other" is fully supported — it just means the skills ask before using a host-specific command
# instead of assuming one.
HOST="other"

# The tracker CLI, if there is one: gh | glab | none. Never assumed from HOST — plenty of projects
# are hosted one place and tracked another.
TRACKER_CLI="none"

# The repo issues are filed against, in whatever form TRACKER_CLI wants (usually owner/repo).
# Leave empty if TRACKER_CLI is none.
TRACKER_REPO=""

# --- team and machine shape ----------------------------------------------------------------------
#
# These two switches decide what /setup wires up. They are separate questions on purpose, because
# they gate different things and the second is true far more often than people expect.

# solo | shared. SHARED turns on the union merge driver, collab_settled.md, and per-owner live task
# directories. It is about how many people WRITE to these docs, not how many read them.
PEOPLE="solo"

# single | multi. MULTI turns on pull_main.sh, the Machine: stamp in handoff.md, and /load's
# divergence check. A solo developer with a laptop and a desktop is MULTI, and so is anyone using
# a cloud container — the failure it prevents is a stale doc, which needs two machines, not two
# people.
MACHINES="single"

# Project identity — written by /setup, read by every hook, script and skill through hooks/lib.sh,
# so that NOTHING else in .claude/ hardcodes your repo name, your git host, or how your team is
# shaped. POSIX `KEY=value` deliberately: shell sources it and skills grep it, where JSON would need
# `jq`, which a fresh cloud container does not have. Edit by hand any time.

# The project this .claude/ belongs to. Used in backup paths and in what the hooks print.
PROJECT_NAME="<project>"

# This working-docs repo — the one cloned as .claude/. The name is convention only; nothing
# depends on it matching.
DOCS_REPO_NAME="<project>-claude"

# The clone URL for DOCS_REPO_NAME, exactly as you would type it. It is what a machine that has not
# cloned .claude/ yet gets told to run, so paste the one your host actually gives you.
DOCS_REPO_URL=""

# The branch DOCS_REPO_NAME lives on. Say so here rather than editing the hooks.
DOCS_BRANCH="main"

# --- host and tracker ----------------------------------------------------------------------------

# Where the CODE repo is hosted: github | gitlab | other. /setup detects it from `git remote -v`.
# "other" is fully supported: the skills ask before using a host-specific command.
HOST="other"

# The tracker CLI, if there is one: gh | glab | none. Never assumed from HOST.
TRACKER_CLI="none"

# The repo issues are filed against, in whatever form TRACKER_CLI wants (usually owner/repo).
TRACKER_REPO=""

# no | yes. YES means work lives on the tracker: /setup removes issues.md, hotfixes.md and
# deferred.md, findings are reported and filed as issues, and temporary code is a `TEMPORARY (<date>)`
# marker at the site plus the issue whose closure removes it. Forced to no when TRACKER_CLI="none".
TRACKER_FIRST="no"

# The tracker label meaning "cannot start until someone rules on this". Used by the meeting skills.
NEEDS_RULING_LABEL="needs-ruling"

# How a task's feature branch is named. <owner> is the owner directory, or the git user name on solo.
BRANCH_PATTERN="<owner>_<slug>"

# no | yes. YES when a tracker workflow derives area and needs-ruling labels itself, so nothing passes them.
LABELS_DERIVED="no"

# The closed set of kind labels, exactly one per filed issue. Empty means pass no labels at all.
KIND_LABELS="bug enhancement task investigation"

# --- team and machine shape ----------------------------------------------------------------------

# solo | shared. SHARED turns on the union merge driver, collab_settled.md and per-owner live task
# directories. It is about how many people WRITE to these docs, not how many read them.
PEOPLE="solo"

# single | multi. MULTI wires pull_main.sh, the Machine: stamp in handoff.md and /load's divergence
# check. A laptop plus a desktop is MULTI, and so is any cloud container: the failure it prevents
# needs two machines, not two people.
MACHINES="single"
